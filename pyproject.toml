[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battherm"
version = "0.1.0"
description = "Physics-informed deep learning for Li-ion cell temperature forecasting (battery thermal management)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
battherm = "battherm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
