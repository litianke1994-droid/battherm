# DEVELOPMENT protocol for the ambient hold-out (added after the v1 test run, see docs/results_hg2.md).
# Mimics the 40 C extrapolation one step lower: train on -20..10 C, validate on all 25 C cycles.
# Used to choose the v2 options (physics.heat, windows.relative_temperature) without the test set.
[experiment]
# Hyper-parameters below were frozen after validation sweeps (outputs/sweeps, docs/tuning_log.md).
name = "hg2_ambient_dev"
eval_split = "val"     # development only: the 40 C test windows are never built
seed = 42
data_path = "data/processed/hg2.csv.gz"
output_dir = "outputs"

[windows]
past_s = 300          # tuned on validation: 120 / 300 / 600 s tried
horizon_s = 60
train_stride_s = 5
eval_stride_s = 10

[split]
test_ambients = [40.0]
val_ambients = [25.0]  # pseudo-extrapolation: train -20..10 C, validate at 25 C

[physics]
fit_window_s = 30

[ridge]
alphas = [0.01, 0.1, 1.0, 10.0, 100.0]
past_subsample = 10

[hybrid]
physics_as_input = true  # physics forecast is also a decoder input

[models]
enabled = ["persistence", "physics", "ridge", "lstm", "cnn", "hybrid_lstm"]

[train]
device = "auto"
epochs = 80
batch_size = 512
lr = 1e-3
weight_decay = 0.0
patience = 10
lr_plateau = true     # halve lr when validation RMSE stalls (tuned)
lr_plateau_patience = 3
grad_clip = 1.0

[lstm]
hidden = 128          # tuned: 64 / 128
layers = 1
dropout = 0.0

[cnn]
channels = 64         # tuned: 32 / 64
kernel = 5
enc_layers = 4
