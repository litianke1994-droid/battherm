# LG 18650HG2, EXTRAPOLATION to an unseen ambient temperature (the hard case).
# Expect data-driven models to degrade here; the physics prior should help the hybrid model.
[experiment]
name = "hg2_ambient_holdout"
seed = 42
data_path = "data/processed/hg2.csv.gz"
output_dir = "outputs"

[windows]
past_s = 120
horizon_s = 60
train_stride_s = 5
eval_stride_s = 10

[split]
test_ambients = [40.0]
val_profiles = ["Mixed7"]

[physics]
fit_window_s = 30

[ridge]
alphas = [0.01, 0.1, 1.0, 10.0, 100.0]
past_subsample = 10

[models]
enabled = ["persistence", "physics", "ridge", "lstm", "cnn", "hybrid_lstm"]

[train]
device = "auto"
epochs = 60
batch_size = 512
lr = 1e-3
weight_decay = 0.0
patience = 8
grad_clip = 1.0

[lstm]
hidden = 64
layers = 1
dropout = 0.0

[cnn]
channels = 32
kernel = 5
enc_layers = 4
